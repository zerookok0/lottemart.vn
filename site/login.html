<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | LOTTE Mart Việt Nam</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/base.css">
  <script>
  (function(){
    var K=['utm_source','utm_medium','utm_campaign','utm_term','utm_content',
           'utm_id','fbclid','ttclid','gclid','adset_id','campaign_id',
           'sub1','sub2','sub3','sub4','sub5'];
    function grab(q){var o={},p=(q||'').replace(/^\?/,'').split('&');for(var i=0;i<p.length;i++){
      var kv=p[i].split('=');if(kv.length<2)continue;try{var k=decodeURIComponent(kv[0]);
      if(K.indexOf(k)!==-1)o[k]=decodeURIComponent(kv.slice(1).join('='));}catch(e){}}return o;}
    function load(){try{return JSON.parse(sessionStorage.getItem('bp_utm')||'{}')}catch(e){return {}}}
    function save(o){try{sessionStorage.setItem('bp_utm',JSON.stringify(o))}catch(e){}
      try{var d=new Date();d.setTime(d.getTime()+7*864e5);
      document.cookie='bp_utm='+encodeURIComponent(JSON.stringify(o))+'; expires='+d.toUTCString()+'; path=/; SameSite=Lax';}catch(e){}}
    var cur=load(),add=false;
    var m=grab(location.search); for(var a in m){cur[a]=m[a];add=true}
    try{var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
      if(n&&n.name){var mm=grab(n.name.split('?')[1]||'');for(var b in mm){cur[b]=mm[b];add=true}}}catch(e){}
    try{if(document.referrer){var mm2=grab((document.referrer.split('?')[1])||'');
      for(var c in mm2){if(!cur[c]){cur[c]=mm2[c];add=true}}}}catch(e){}
    if(add)save(cur);
    window.__BP_UTM__=cur;
  })();
  </script>
  <script src="/assets/config.js"></script>
  <script defer src="/assets/pixel.js"></script>
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/layout.js"></script>
  <script defer src="/assets/auth.js"></script>
</head>
<body data-page="login">
  <div data-lm-header></div>
  <main class="lm-main">
    <div class="container">
      <div class="lm-auth">
        <div class="lm-auth-card">
          <div class="lm-auth-brand">
            <a class="lm-logo" href="/"><img src="/assets/logo-lotte.svg" alt="LOTTE Mart" width="30" height="30"><span class="lm-logo-word">LOTTE MART</span></a>
            <p>Kênh đi chợ Online của LOTTE Mart</p>
          </div>
          <div class="lm-auth-box">
            <div class="lm-auth-tabs">
              <button type="button" class="on" data-auth-tab="account">Tài Khoản</button>
              <button type="button" data-auth-tab="otp">Bằng OTP</button>
            </div>
            <div class="lm-form-err" data-form-err></div>
            <form data-login-form novalidate>
              <div data-pane="account">
                <div class="lm-field">
                  <label for="lg-email">Email/Số điện thoại <span class="req">*</span></label>
                  <input id="lg-email" name="email" type="text" autocomplete="username" placeholder="email@example.com">
                </div>
                <div class="lm-field">
                  <label for="lg-pass">Mật khẩu <span class="req">*</span></label>
                  <input id="lg-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
                </div>
                <div style="text-align:right;margin-bottom:14px"><a class="btn-link" href="/vi-nsg/account-management" style="font-size:12.5px">Quên mật khẩu?</a></div>
              </div>
              <div data-pane="otp" class="hidden">
                <div class="lm-field">
                  <label for="lg-phone">Số điện thoại <span class="req">*</span></label>
                  <input id="lg-phone" name="phone" type="tel" autocomplete="tel" placeholder="0901 234 567">
                </div>
                <div class="lm-field">
                  <label for="lg-otp">Mã OTP</label>
                  <input id="lg-otp" name="otp" type="text" inputmode="numeric" placeholder="6 chữ số">
                </div>
                <p class="lm-auth-hint">Nhập email/số điện thoại ở tab Tài Khoản để đăng nhập nhanh.</p>
              </div>
              <button class="btn btn-block btn-lg" type="submit">Đăng nhập</button>
            </form>
            <div class="lm-auth-alt">Hoặc đăng nhập với</div>
            <div class="lm-auth-social">
              <button type="button">Zalo</button>
              <button type="button">Google</button>
              <button type="button">Kakao Talk</button>
              <button type="button">Apple ID</button>
            </div>
          </div>
          <div class="lm-auth-foot">Quý khách chưa có tài khoản? <a href="/register">Đăng ký</a></div>
        </div>
      </div>
    </div>
  </main>
  <div data-lm-footer></div>
</body>
</html>
